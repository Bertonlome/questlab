id: sart
name: "Situation Awareness Rating Technique (SART)"
instructions: >
  The following are 7-point Likert scale questions. Please respond by marking
  the answer that you think best describes your feelings.

questions:

  - id: instability_of_situation
    type: likert7
    label: "Instability of Situation"
    description: >
      How changeable is the situation? Is the situation highly unstable and
      likely to change suddenly (High), or is it very stable and straightforward
      (Low)?

  - id: complexity_of_situation
    type: likert7
    label: "Complexity of Situation"
    description: >
      How complicated is the situation? Is it complex with many interrelated
      components (High), or is it simple and straightforward (Low)?

  - id: variability_of_situation
    type: likert7
    label: "Variability of Situation"
    description: >
      How many variables are changing within the situation? Are there a large
      number of factors varying (High), or are there very few variables changing
      (Low)?

  - id: arousal
    type: likert7
    label: "Arousal"
    description: >
      How aroused are you in the situation? Are you alert and ready for activity
      (High), or do you have a low degree of alertness (Low)?

  - id: concentration_of_attention
    type: likert7
    label: "Concentration of Attention"
    description: >
      How much are you concentrating on the situation? Are you concentrating on
      many aspects of the situation (High), or focused on only one (Low)?

  - id: division_of_attention
    type: likert7
    label: "Division of Attention"
    description: >
      How much is your attention divided in the situation? Are you
      concentrating on many aspects of the situation (High), or focused on only
      one (Low)?

  - id: spare_mental_capacity
    type: likert7
    label: "Spare Mental Capacity"
    description: >
      How much mental capacity do you have to spare in the situation? Do you
      have sufficient capacity to attend to many variables (High), or nothing to
      spare at all (Low)?

  - id: information_quantity
    type: likert7
    label: "Information Quantity"
    description: >
      How much information have you gained about the situation? Have you
      received and understood a great deal of knowledge (High), or very little
      (Low)?

  - id: familiarity_with_situation
    type: likert7
    label: "Familiarity with Situation"
    description: >
      How familiar are you with the situation? Do you have a great deal of
      relevant experience (High), or is it a new situation (Low)?
